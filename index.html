<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>wonderkidsbangla</title>

    <link rel="stylesheet" href="index.css">
    <style>
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            place-items: center;
            background: #ffffff;
        }

        #splash-screen img {
            max-width: 80vw;
            max-height: 80vh;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <div id="splash-screen" aria-hidden="true">
        <img src="images/wkb.png" alt="">
    </div>

    <!-- TOP HEADER -->
    <header class="top-header">

        <!-- LEFT SIDE -->
        <div class="header-left">

            <div class="small-symbol">◉</div>
            <div class="small-symbol">◎</div>

            <span>WONDERKIDSBANGLA TRADEMARK 2026</span>

        </div>


        <!-- CENTER LOGO -->
        <a href="index.html" class="logo-link">
            <img
                src="images/2.png"
                alt="Wonderkids Bangla"
                class="brand-logo"
            >
        </a>


        <!-- RIGHT SIDE -->
        <div class="header-right">

            <span>◈</span>
            <span>◎</span>
            <span>▣</span>

        </div>

    </header>


    <!-- NAVIGATION -->
    <nav class="navbar">

        <ul class="nav-links">

            <li>
                <a href="index.html" class="active">HOME</a>
            </li>

            <li>
                <a href="wonderkids.html">WONDERKIDS</a>
            </li>

            <li>
                <a href="about.html">ABOUT</a>
            </li>

            <li>
                <a href="upcoming.html">UPCOMING GAMES</a>
            </li>

            <li>
                <a href="merch.html">MERCH</a>
            </li>

            <li>
                <a href="collab.html">COLLABORATIONS</a>
            </li>

            <li>
                <a href="contact.html">CONTACT</a>
            </li>

        </ul>


        <a href="#" class="cart">
            🛒 <span>0</span>
        </a>

    </nav>


    <!-- HERO -->
    <main>

        <section class="hero">

            <button class="hero-arrow arrow-left" aria-label="Previous image">
                ‹
            </button>

            <video
                class="hero-video"
                autoplay
                muted
                loop
                playsinline
            >
                <source src="videos/intro.mp4" type="video/mp4">
                Your browser does not support HTML5 video.
            </video>

            <button class="hero-arrow arrow-right" aria-label="Next image">
                ›
            </button>

        </section>

    </main>

    <script>
        setTimeout(() => {
            document.getElementById("splash-screen").remove();
        }, 1000);
    </script>

</body>

</html>
